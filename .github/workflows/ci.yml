name: Offline audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Initialize offline example
        run: scinet init --workspace .ci-work
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify public panel case
        run: python docs/cases/2026-10-24-powerlaw-panel/verify.py
      - name: Run deterministic audit
        run: scinet --workspace .ci-work run
      - name: Verify latest audit
        run: scinet --workspace .ci-work verify latest
